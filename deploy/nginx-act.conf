# act.raisethevoices.org — behind the host Caddy/nginx; adjust to VM's pattern
server {
    listen 80;
    server_name act.raisethevoices.org;
    client_max_body_size 200m;  # video testimony uploads
    location /static/ { alias /opt/apps/act/staticfiles/; }
    location /media/  { alias /opt/apps/act/media/; }
    location / {
        proxy_pass http://127.0.0.1:8050;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
