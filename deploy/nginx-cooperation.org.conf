# cooperation.org — act serves ONLY /letters/, /admin/, /static/, /media/.
#
# cooperation.org already has a static-site server block on the VM
# (/etc/nginx/sites-available/cooperation-org). These locations are added
# INSIDE that block; do not create a second server block. TLS is done by the
# host Caddy (caddy-domain add cooperation.org 10.0.0.<vm>:80), so port 80 only.
#
# The static vhost sets a Content-Security-Policy that forbids scripts and form
# posts. add_header inside a location replaces the server-level headers for
# that path, so the app locations declare their own.

    location /static/ {
        alias /opt/apps/act/staticfiles/;
        expires 7d;
    }
    location /media/ {
        alias /opt/apps/act/media/;
        expires 7d;
    }
    location /letters/ {
        client_max_body_size 5m;   # drawn signature PNG (form caps it at 200 KB)
        proxy_pass http://127.0.0.1:8050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;
    }
    location /admin/ {
        client_max_body_size 5m;
        proxy_pass http://127.0.0.1:8050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
