# cooperation.org — letters at /letters/<slug>/ ; behind the host Caddy (caddy-domain add cooperation.org 10.0.0.<vm>:80)
server {
    listen 80;
    server_name cooperation.org www.cooperation.org;
    client_max_body_size 5m;
    location /static/ { alias /opt/apps/act/staticfiles/; }
    location /media/  { alias /opt/apps/act/media/; }
    location /letters/ {
        proxy_pass http://127.0.0.1:8050;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /admin/ {
        proxy_pass http://127.0.0.1:8050;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = / { return 302 /letters/; }
}
