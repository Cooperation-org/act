{% if a.is_image %}<img src="{{ a.file.url }}" alt="{{ a.title|default:a.words|truncatechars:120 }}" loading="lazy">{% elif a.is_video %}<video src="{{ a.file.url }}#t=0.1" preload="metadata" muted playsinline></video>{% elif a.kind == "voice" %}<span aria-hidden="true">🎙</span>{% elif a.kind == "claim" %}<span aria-hidden="true">✅</span>{% elif a.kind == "link" %}<span aria-hidden="true">🔗</span>{% elif a.kind == "text" %}<span aria-hidden="true">📝</span>{% else %}<span aria-hidden="true">📄</span>{% endif %}
